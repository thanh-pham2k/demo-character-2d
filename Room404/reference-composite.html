<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room 404 — Đối chiếu các lớp</title>
<style>
body{margin:0;background:#151d27;color:#eee;font:14px system-ui}main{max-width:1100px;margin:auto;padding:28px}a{color:#edb873}h1{margin-bottom:6px}p{color:#bcc7d0;line-height:1.5;max-width:75ch}.toolbar{display:flex;gap:14px;align-items:center;margin:18px 0}.stage{position:relative;width:min(100%,768px);aspect-ratio:3/2;overflow:hidden;background-color:#eee;background-image:linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%),linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%);background-size:24px 24px;background-position:0 0,12px 12px}.stage img{position:absolute;display:block}.reference{inset:0;width:100%;height:100%;opacity:.25}.layer{object-fit:fill;pointer-events:none}.toolbar input{accent-color:#edb873}
</style>
</head>
<body><main><a href="reference-drafts.html">← Các lớp nháp</a><h1>Đối chiếu các lớp với ảnh gốc</h1><p>Các lớp vẫn là bản nháp. Phần đồ vật bị che được dựng gần đúng; nền phòng chưa tách. Bật ảnh gốc để kiểm tra vị trí, không dùng trang này làm cảnh chơi.</p><div class="toolbar"><label><input id="background-toggle" type="checkbox"> Hiện nền nháp</label><label><input id="reference-toggle" type="checkbox" checked> Hiện ảnh gốc phía dưới</label><label>Độ mờ <input id="reference-opacity" type="range" min="0" max="100" value="25"></label></div><div id="stage" class="stage"><img id="draft-background" class="reference" src="assets/reference-draft/background_reconstructed.svg" alt="" style="opacity:0"><img id="reference" class="reference" src="assets/reference.png" alt=""></div><p id="status">Đang tải các lớp…</p></main>
<script>
const stage=document.querySelector('#stage');
const reference=document.querySelector('#reference');
const toggle=document.querySelector('#reference-toggle');
const backgroundToggle=document.querySelector('#background-toggle');
const draftBackground=document.querySelector('#draft-background');
backgroundToggle.addEventListener('change',()=>{draftBackground.style.opacity=backgroundToggle.checked?1:0;});
const opacity=document.querySelector('#reference-opacity');
function updateReference(){reference.style.opacity=toggle.checked?opacity.value/100:0;}
toggle.addEventListener('change',updateReference);opacity.addEventListener('input',updateReference);
const reconstructed = new Set(['laptop_left','laptop_right','bed_front_post_left','bed_front_post_right']);
const priority=id=>{
  if(id.startsWith('rug'))return 1;
  if(id.startsWith('bed_back_rail')||id.startsWith('bed_side_rail')||id.startsWith('bed_inner_side_rail'))return 2;
  if(id.startsWith('bed_bedding'))return 3;
  if(id.startsWith('desk_drawer')||id.startsWith('bookshelf'))return 4;
  if(id.startsWith('desk_surface')||id.startsWith('center_table'))return 5;
  if(id.startsWith('ladder'))return 6;
  if(id.startsWith('bed_front_rail'))return 7;
  if(id.startsWith('bed_front_post')||id.startsWith('bed_inner_post'))return 8;
  if(id.startsWith('chair'))return 9;
  return 10;
};
fetch('assets/reference-draft/placements.json').then(r=>{if(!r.ok)throw new Error('Không tải được placements.json');return r.json();}).then(data=>{
  for(const item of data.assets.filter(item=>!item.id.startsWith('pillow_')).sort((a,b)=>priority(a.id)-priority(b.id))){
    const image=document.createElement('img');image.className='layer';image.alt='';image.src='assets/reference-draft/'+(reconstructed.has(item.id)?item.id+'_reconstructed.svg':item.asset);
    Object.assign(image.style,{left:`${item.x*100}%`,top:`${item.y*100}%`,width:`${item.width*100}%`,height:`${item.height*100}%`,zIndex:priority(item.id)});stage.append(image);
  }
  document.querySelector('#status').textContent='Bố cục nháp; chưa có nền tách sạch và chưa kiểm tra toàn bộ đường cắt.';
}).catch(error=>document.querySelector('#status').textContent=error.message);
</script></body></html>
